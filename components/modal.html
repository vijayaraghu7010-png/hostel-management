<!-- Reference / Template file for modals (Not injected directly, used for codebase reference) -->

<div class="modal-overlay" id="example-modal-id">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Modal Title</h3>
      <button class="modal-close" onclick="closeModal('example-modal-id')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <!-- Modal Contents / Forms go here -->
      <form id="example-modal-form">
        <div class="form-group">
          <label class="form-label">Input Label</label>
          <input type="text" class="form-control" placeholder="Enter details...">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="closeModal('example-modal-id')">Cancel</button>
      <button class="btn btn-primary btn-sm" type="submit" form="example-modal-form">Save Changes</button>
    </div>
  </div>
</div>
