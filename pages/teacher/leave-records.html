<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Records - Hostel ERP</title>
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/teacher.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Departmental Leave Ledgers</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Review outing history, medical leave documents, and academic gatepass statistics</p>
          </div>

          <!-- Filters & Search Ledger -->
          <div class="glass-card" style="margin-bottom: 1.5rem; padding: 1.25rem 1.5rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-grow: 1; max-width: 400px;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="teacher-leaves-search" class="form-control" placeholder="Search student name, ID, or reason..." style="margin-bottom: 0;">
              </div>
              <div style="display: flex; gap: 0.75rem; align-items: center;">
                <label class="form-label" for="filter-teacher-leaves-status" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem;">Status:</label>
                <select id="filter-teacher-leaves-status" class="form-control" style="margin-bottom: 0; max-width: 140px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="Pending">Pending</option>
                  <option value="Approved">Approved</option>
                  <option value="Rejected">Rejected</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Leave Records Table Card -->
          <div class="glass-card" style="padding: 0; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
              <h3 style="font-size: 1rem; font-weight: 700;"><i class="fa-solid fa-clipboard-list" style="margin-right: 0.5rem; color: var(--primary);"></i>Outstation Gatepass Records</h3>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Contains history of outings and medical leave filings</span>
            </div>

            <div class="table-responsive">
              <table class="table-custom" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th style="cursor: pointer;" id="sort-teacher-lv-id">Leave ID <i class="fa-solid fa-sort"></i></th>
                    <th>Student Name (Room)</th>
                    <th style="cursor: pointer;" id="sort-teacher-lv-date">Dates / Duration <i class="fa-solid fa-sort"></i></th>
                    <th>Reason Description</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="teacher-leaves-tbody">
                  <!-- Hydrated by JS teacher.js -->
                </tbody>
              </table>
            </div>

            <!-- Table Pagination controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.75rem;">
              <span style="font-size: 0.8rem; color: var(--text-secondary);" id="pagination-info-teacher-leaves">Showing 0 to 0 of 0 requests</span>
              <div style="display: flex; gap: 0.5rem;" id="pagination-btns-teacher-leaves">
                <button class="btn btn-secondary btn-sm" id="btn-prev-page-teacher-leaves" disabled>Previous</button>
                <button class="btn btn-secondary btn-sm" id="btn-next-page-teacher-leaves" disabled>Next</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/teacher.js"></script>
</body>
</html>
