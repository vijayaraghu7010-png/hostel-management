<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Students - Hostel ERP</title>
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/hod.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Department Student Registry</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Full log of academic branch students, room allocations, and daily attendance status</p>
          </div>

          <!-- Filters & Search Ledger -->
          <div class="glass-card" style="margin-bottom: 1.5rem; padding: 1.25rem 1.5rem;">
            <div class="filter-bar">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-grow: 1; max-width: 400px; min-width: 200px;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="dept-students-search" class="form-control" placeholder="Search student name, reg, or room..." style="margin-bottom: 0;">
              </div>
              <div class="filter-group">
                <label class="form-label" for="filter-dept-status" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem; white-space: nowrap;">Status Today:</label>
                <select id="filter-dept-status" class="form-control" style="margin-bottom: 0; max-width: 180px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="In Hostel">In Hostel</option>
                  <option value="On Approved Leave">On Approved Leave</option>
                  <option value="Illegal Absence">Illegal Absence</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Students Table Card -->
          <div class="glass-card" style="padding: 0; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.5rem;">
              <h3 style="font-size: 1rem; font-weight: 700; margin: 0;"><i class="fa-solid fa-users-line" style="margin-right: 0.5rem; color: var(--primary);"></i>Registered Students Status</h3>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Updates in real-time on Warden evening roll calls</span>
            </div>

            <div class="table-responsive">
              <table class="table-custom" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th style="cursor: pointer;" id="sort-dept-reg">Register Number <i class="fa-solid fa-sort"></i></th>
                    <th style="cursor: pointer;" id="sort-dept-name">Student Name <i class="fa-solid fa-sort"></i></th>
                    <th>Room</th>
                    <th>Status Today</th>
                  </tr>
                </thead>
                <tbody id="hod-dept-tbody">
                  <!-- Hydrated by JS hod.js -->
                </tbody>
              </table>
            </div>

            <!-- Table Pagination controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.75rem;">
              <span style="font-size: 0.8rem; color: var(--text-secondary);" id="pagination-info-dept">Showing 0 to 0 of 0 students</span>
              <div style="display: flex; gap: 0.5rem;" id="pagination-btns-dept">
                <button class="btn btn-secondary btn-sm" id="btn-prev-page-dept" disabled>Previous</button>
                <button class="btn btn-secondary btn-sm" id="btn-next-page-dept" disabled>Next</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/hod.js"></script>
</body>
</html>
