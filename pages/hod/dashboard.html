<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOD Dashboard - Hostel ERP</title>
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/hod.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Departmental Oversight Dashboard</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Monitor academic branch rosters, outstation leaves, and roll-call records</p>
          </div>

          <!-- Stats Grid -->
          <div class="stats-grid">
            <!-- Dept Students -->
            <div class="glass-card stat-card">
              <div class="stat-icon">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Department Students</span>
                <span class="stat-value" id="stats-dept-students">0</span>
              </div>
            </div>

            <!-- Hostel Residents -->
            <div class="glass-card stat-card">
              <div class="stat-icon secondary">
                <i class="fa-solid fa-hotel"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Hostel Residents</span>
                <span class="stat-value" id="stats-hostel-students">0</span>
              </div>
            </div>

            <!-- Leave Students -->
            <div class="glass-card stat-card">
              <div class="stat-icon warning">
                <i class="fa-solid fa-umbrella-beach"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Active Leaves</span>
                <span class="stat-value" id="stats-leave-students">0</span>
              </div>
            </div>

            <!-- Illegal Absence -->
            <div class="glass-card stat-card">
              <div class="stat-icon danger">
                <i class="fa-solid fa-circle-exclamation"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Illegal Absence</span>
                <span class="stat-value" id="stats-illegal-leave">0</span>
              </div>
            </div>

            <!-- Attendance Percentage -->
            <div class="glass-card stat-card">
              <div class="stat-icon success">
                <i class="fa-solid fa-clipboard-user"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Attendance Rate</span>
                <span class="stat-value" id="stats-attendance-rate">0%</span>
              </div>
            </div>

            <!-- Complaints Count -->
            <div class="glass-card stat-card">
              <div class="stat-icon" style="background: var(--grad-dark); color: var(--text-light);">
                <i class="fa-solid fa-triangle-exclamation"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Pending Complaints</span>
                <span class="stat-value" id="stats-pending-complaints">0</span>
              </div>
            </div>
          </div>

          <!-- Quick review tables row -->
          <div class="row">
            <!-- Student Table -->
            <div class="col-md-12">
              <div class="glass-card" style="height: 100%;">
                <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;"><i class="fa-solid fa-building-columns" style="margin-right: 0.5rem; color: var(--primary);"></i>Department Student Roster</h3>
                <div class="table-responsive">
                  <table class="table-custom">
                    <thead>
                      <tr>
                        <th>Register Number</th>
                        <th>Student Name</th>
                        <th>Room</th>
                        <th>Status Today</th>
                      </tr>
                    </thead>
                    <tbody id="hod-recent-students">
                      <!-- Hydrated by JS hod.js -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/hod.js"></script>
</body>
</html>
