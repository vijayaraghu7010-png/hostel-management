<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Status - Hostel ERP</title>
  
  <!-- CSS Library -->
  
  
  
  
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/components-9f2f1ffe.css">
  <link rel="stylesheet" href="/assets/student-0ad389cb.css">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Track Complaint Timeline</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Monitor step-by-step resolution status of maintenance filings</p>
          </div>

          <!-- Selector Widget -->
          <div class="glass-card" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
              <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Active Filings</span>
              <span style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">Select complaint to track:</span>
            </div>
            <div style="flex-grow: 1; max-width: 400px; width: 100%;">
              <select class="form-control" id="timeline-complaint-select" style="margin-bottom: 0;">
                <!-- Populated by JS -->
              </select>
            </div>
          </div>

          <!-- Timeline Output Area -->
          <div id="timeline-render-area">
            <!-- Rendered by JS student.js -->
            <div class="spinner-container">
              <div class="spinner"></div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/student.js"></script>
</body>
</html>
