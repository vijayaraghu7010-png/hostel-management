<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hour - Student Hostel ERP</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/student.css">
  <link rel="stylesheet" href="../../css/scanner-ui.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar Container -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body" style="padding: 1.25rem;">
        <div class="container-fluid" style="max-width: 720px; margin: 0 auto;">
          
          <!-- Header -->
          <div style="margin-bottom: 1.5rem; text-align: center;">
            <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <i class="fa-solid fa-clock-rotate-left" style="color: var(--primary);"></i>
              Evening Study Hour
            </h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
              Display your QR code for the Warden to scan and record attendance
            </p>
          </div>

          <!-- Active / Inactive Session Status Card -->
          <div class="glass-card" id="student-session-card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 1.5rem; text-align: center; box-shadow: var(--shadow-md);">
            <div id="student-session-content">
              <!-- Hydrated dynamically -->
              <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
              <p style="margin-top: 0.5rem; color: var(--text-muted);">Loading active session status...</p>
            </div>
          </div>

          <!-- Attendance History Card -->
          <div class="glass-card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-top: 1.5rem;">
            <h3 style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin: 0 0 1rem 0;">
              <i class="fa-solid fa-calendar-check" style="color: var(--primary); margin-right: 0.4rem;"></i>
              My Study Attendance History
            </h3>

            <div class="table-responsive">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Session</th>
                    <th>Scan Time</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="student-study-history-tbody">
                  <!-- Hydrated dynamically -->
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/vendor/qrcode.min.js"></script>
  <script src="../../js/vendor/zxing-browser.min.js"></script>
  <script src="../../js/vendor/qr-scanner.umd.min.js"></script>
  <script src="../../js/scanner-ui.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/student.js"></script>
</body>
</html>
