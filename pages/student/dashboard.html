<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Hostel ERP</title>
  
  <!-- CSS Library -->
  
  
  
  
  
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/components-9f2f1ffe.css">
  <link rel="stylesheet" href="/assets/student-0ad389cb.css">
  <link rel="stylesheet" href="/assets/scanner-ui-5c95562f.css">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Welcome Intro -->
          <div style="margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Overview Dashboard</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Monitor your active complaints, leave records, and room details</p>
          </div>

          <!-- Real-Time Live Study Hour Dashboard Card -->
          <div class="glass-card" id="student-study-hour-banner" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); transition: all 0.3s ease;">
            <div id="study-banner-content">
              <!-- Live hydrated via JS real-time sync -->
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--primary);"></i>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Syncing study hour session status...</span>
              </div>
            </div>
          </div>

          <!-- Stats Cards Grid -->
          <div class="stats-grid">
            <!-- Total Complaints -->
            <div class="glass-card stat-card">
              <div class="stat-icon">
                <i class="fa-solid fa-list-check"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Total Complaints</span>
                <span class="stat-value" id="stats-total-complaints">0</span>
              </div>
            </div>

            <!-- Pending Complaints -->
            <div class="glass-card stat-card">
              <div class="stat-icon warning">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Pending Cases</span>
                <span class="stat-value" id="stats-pending-complaints">0</span>
              </div>
            </div>

            <!-- Resolved Complaints -->
            <div class="glass-card stat-card">
              <div class="stat-icon success">
                <i class="fa-solid fa-square-check"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Resolved Cases</span>
                <span class="stat-value" id="stats-resolved-complaints">0</span>
              </div>
            </div>

            <!-- Leave Requests -->
            <div class="glass-card stat-card">
              <div class="stat-icon secondary">
                <i class="fa-solid fa-umbrella-beach"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Leave Requests</span>
                <span class="stat-value" id="stats-leave-requests">0</span>
              </div>
            </div>
          </div>

          <!-- History Table & Actions row -->
          <div class="row">
            <!-- Table Col -->
            <div class="col-md-12">
              <div class="glass-card" style="height: 100%;">
                <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;"><i class="fa-solid fa-history" style="margin-right: 0.5rem; color: var(--primary);"></i>Recent Complaints History</h3>
                <div class="table-responsive">
                  <table class="table-custom">
                    <thead>
                      <tr>
                        <th>Complaint ID</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Date Filed</th>
                      </tr>
                    </thead>
                    <tbody id="student-complaints-tbody">
                      <!-- Hydrated by JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/vendor/qrcode.min.js"></script>
  <script src="../../js/vendor/zxing-browser.min.js"></script>
  <script src="../../js/vendor/qr-scanner.umd.min.js"></script>
  <script src="../../js/scanner-ui.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/student.js"></script>
</body>
</html>
