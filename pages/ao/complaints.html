<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints - Hostel ERP</title>
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/ao.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Campus Complaints Ledger</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Supervise active maintenance tickets, allocate staff engineers, and audit logs</p>
          </div>

          <!-- Filters & Search Ledger -->
          <div class="glass-card" style="margin-bottom: 1.5rem; padding: 1.25rem 1.5rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-grow: 1; max-width: 400px;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="ao-complaints-search" class="form-control" placeholder="Search by ID, student, or description..." style="margin-bottom: 0;">
              </div>
              <div style="display: flex; gap: 0.75rem; align-items: center;">
                <label class="form-label" for="filter-ao-category" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem;">Category:</label>
                <select id="filter-ao-category" class="form-control" style="margin-bottom: 0; max-width: 140px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="Room Issue">Room Issue</option>
                  <option value="Electricity">Electricity</option>
                  <option value="Water">Water</option>
                  <option value="Furniture Damage">Furniture Damage</option>
                  <option value="Cleanliness">Cleanliness</option>
                  <option value="Warden Complaint">Warden Complaint</option>
                </select>

                <label class="form-label" for="filter-ao-status" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem;">Status:</label>
                <select id="filter-ao-status" class="form-control" style="margin-bottom: 0; max-width: 130px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="Pending">Pending</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Escalated">Escalated</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Complaints Table Card -->
          <div class="glass-card" style="padding: 0; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
              <h3 style="font-size: 1rem; font-weight: 700;"><i class="fa-solid fa-screwdriver-wrench" style="margin-right: 0.5rem; color: var(--primary);"></i>All Campus Tickets</h3>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Assign vendor personnel to open tickets or verify closures</span>
            </div>

            <div class="table-responsive">
              <table class="table-custom" style="margin-bottom: 0;">
                <thead>
                  <tr>
                    <th style="cursor: pointer;" id="sort-ao-cmp-id">Ticket ID <i class="fa-solid fa-sort"></i></th>
                    <th>Student Name</th>
                    <th>Category</th>
                    <th style="cursor: pointer;" id="sort-ao-cmp-status">Status <i class="fa-solid fa-sort"></i></th>
                    <th>Assigned Staff</th>
                    <th style="cursor: pointer;" id="sort-ao-cmp-date">Deadline <i class="fa-solid fa-sort"></i></th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="ao-full-complaints-tbody">
                  <!-- Hydrated by JS ao.js -->
                </tbody>
              </table>
            </div>

            <!-- Table Pagination controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.75rem;">
              <span style="font-size: 0.8rem; color: var(--text-secondary);" id="pagination-info-ao">Showing 0 to 0 of 0 tickets</span>
              <div style="display: flex; gap: 0.5rem;" id="pagination-btns-ao">
                <button class="btn btn-secondary btn-sm" id="btn-prev-page-ao" disabled>Previous</button>
                <button class="btn btn-secondary btn-sm" id="btn-next-page-ao" disabled>Next</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/ao.js"></script>
</body>
</html>
