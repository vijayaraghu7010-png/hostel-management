<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints - Hostel ERP</title>
  
  <!-- CSS Library -->
  
  
  
  
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/components-9f2f1ffe.css">
  <link rel="stylesheet" href="/assets/warden-033cd534.css">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Maintenance Complaints Management</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Dispatch tasks, track service progress, and check resolutions</p>
          </div>

          <!-- Filters & Search Ledger -->
          <div class="glass-card" style="margin-bottom: 1.5rem; padding: 1.25rem 1.5rem;">
            <div class="filter-bar">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-grow: 1; max-width: 400px; min-width: 200px;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="complaints-search" class="form-control" placeholder="Search by ID, student, or description..." style="margin-bottom: 0;">
              </div>
              <div class="filter-group">
                <label class="form-label" for="filter-category" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem; white-space: nowrap;">Category:</label>
                <select id="filter-category" class="form-control" style="margin-bottom: 0; max-width: 140px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="Room Issue">Room Issue</option>
                  <option value="Electricity">Electricity</option>
                  <option value="Water">Water</option>
                  <option value="Furniture Damage">Furniture Damage</option>
                  <option value="Cleanliness">Cleanliness</option>
                  <option value="Warden Complaint">Warden Complaint</option>
                </select>
                
                <label class="form-label" for="filter-status" style="margin-bottom: 0; font-weight: 600; font-size: 0.8rem; white-space: nowrap;">Status:</label>
                <select id="filter-status" class="form-control" style="margin-bottom: 0; max-width: 130px; padding: 0.35rem 0.75rem;">
                  <option value="">All</option>
                  <option value="Pending">Pending</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Escalated">Escalated</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Complaints Table Card -->
          <div class="glass-card" style="padding: 0; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.5rem;">
              <h3 style="font-size: 1rem; font-weight: 700; margin: 0;"><i class="fa-solid fa-list-check" style="margin-right: 0.5rem; color: var(--primary);"></i>Student Maintenance Tickets</h3>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Process: Pending &rarr; In Progress &rarr; Resolved</span>
            </div>

            <div class="table-responsive">
              <table class="table-custom" style="margin-bottom: 0; min-width: 800px;">
                <thead>
                  <tr>
                    <th style="cursor: pointer;" id="sort-cmp-id">Complaint ID <i class="fa-solid fa-sort"></i></th>
                    <th>Student (Room)</th>
                    <th>Category</th>
                    <th style="cursor: pointer;" id="sort-cmp-status">Status <i class="fa-solid fa-sort"></i></th>
                    <th style="cursor: pointer;" id="sort-cmp-date">Date Filed <i class="fa-solid fa-sort"></i></th>
                    <th style="text-align: right; padding-right: 1.5rem;">Actions</th>
                  </tr>
                </thead>
                <tbody id="warden-complaints-tbody">
                  <!-- Hydrated by JS warden.js -->
                </tbody>
              </table>
            </div>

            <!-- Table Pagination controls -->
            <div class="table-pagination-bar">
              <span style="font-size: 0.8rem; color: var(--text-secondary);" id="pagination-info-cmp">Showing 0 to 0 of 0 complaints</span>
              <div style="display: flex; gap: 0.5rem;" id="pagination-btns-cmp">
                <button class="btn btn-secondary btn-sm" id="btn-prev-page-cmp" disabled>Previous</button>
                <button class="btn btn-secondary btn-sm" id="btn-next-page-cmp" disabled>Next</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/warden.js"></script>
</body>
</html>
