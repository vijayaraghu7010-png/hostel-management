<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warden Dashboard - Hostel ERP</title>
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/warden.css">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Warden Portal Overview</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Supervise hostel allocations, daily attendance, and maintenance filings</p>
          </div>

          <!-- Stats Grid -->
          <div class="stats-grid">
            <!-- Total Students -->
            <div class="glass-card stat-card">
              <div class="stat-icon">
                <i class="fa-solid fa-users"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Total Students</span>
                <span class="stat-value" id="stats-total-students">0</span>
              </div>
            </div>

            <!-- Occupied Rooms -->
            <div class="glass-card stat-card">
              <div class="stat-icon secondary">
                <i class="fa-solid fa-bed"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Occupied Rooms</span>
                <span class="stat-value" id="stats-occupied-rooms">0</span>
              </div>
            </div>

            <!-- Available Rooms -->
            <div class="glass-card stat-card">
              <div class="stat-icon success">
                <i class="fa-solid fa-door-open"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Available Rooms</span>
                <span class="stat-value" id="stats-available-rooms">0</span>
              </div>
            </div>

            <!-- Pending Complaints -->
            <div class="glass-card stat-card">
              <div class="stat-icon warning">
                <i class="fa-solid fa-circle-exclamation"></i>
              </div>
              <div class="stat-info">
                <span class="stat-label">Pending Complaints</span>
                <span class="stat-value" id="stats-pending-complaints">0</span>
              </div>
            </div>
          </div>

          <!-- Tables & Actions Row -->
          <div class="row">
            <!-- Recent Complaints -->
            <div class="col-md-12">
              <div class="glass-card" style="height: 100%;">
                <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;"><i class="fa-solid fa-bars-staggered" style="margin-right: 0.5rem; color: var(--primary);"></i>Recent Maintenance Filings</h3>
                <div class="table-responsive">
                  <table class="table-custom">
                    <thead>
                      <tr>
                        <th>Complaint ID</th>
                        <th>Student (Room)</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Date Filed</th>
                      </tr>
                    </thead>
                    <tbody id="recent-complaints-tbody">
                      <!-- Hydrated by JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/warden.js"></script>
</body>
</html>
