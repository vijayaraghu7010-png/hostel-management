<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Analytics - Hostel ERP</title>
  
  <!-- CSS Library -->
  
  
  
  
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/components-9f2f1ffe.css">
  <link rel="stylesheet" href="/assets/principal-fd8cbe4e.css">
</head>
<body class="theme-light" data-root-path="../../">

  <div class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <div id="navbar-container"></div>
      
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-fluid">
          
          <!-- Header -->
          <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Leave Registrations Analytics</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Trace weekly outstation spikes and outing density reports</p>
          </div>

          <!-- Chart Card -->
          <div class="glass-card" style="display:flex; flex-direction:column; height: 460px;">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1.5rem;"><i class="fa-solid fa-chart-area" style="margin-right: 0.5rem; color: var(--primary);"></i>Weekly Leave Activity Area Trend</h3>
            <div style="position: relative; flex-grow: 1; min-height: 0;">
              <canvas id="area-leave-trends"></canvas>
            </div>
          </div>

        </div>
      </div>
      
      <!-- Footer -->
      <div id="footer-container"></div>
    </main>
  </div>

  <!-- Third-party Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Core Scripts -->
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/charts.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/principal.js"></script>
</body>
</html>
